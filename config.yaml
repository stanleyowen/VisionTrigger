gestures:
  THUMBS_UP:
    action: applescript
    script: set volume output volume (output volume of (get volume settings) + 10)
    label: Volume Up
    cooldown: 0.8
  THUMBS_DOWN:
    action: applescript
    script: set volume output volume (output volume of (get volume settings) - 10)
    label: Volume Down
    cooldown: 0.8
  OPEN_PALM:
    action: shell
    command: 'screencapture -x ~/Desktop/VisionTrigger_$(date +%Y%m%d_%H%M%S).png
      && afplay /System/Library/Sounds/Glass.aiff

      '
    label: Screenshot
    cooldown: 3.0
  PEACE:
    action: applescript
    script: tell application "System Events" to keystroke " " using {command down}
    label: Open Spotlight
    cooldown: 2.0
  FIST:
    action: shell
    command: pmset displaysleepnow
    label: Lock Screen
    cooldown: 3.0
  POINT:
    action: shell
    command: open -a Finder
    label: Open Finder
    cooldown: 2.0
  ROCK:
    action: shell
    command: open -a Terminal
    label: Open Terminal
    cooldown: 3.0
  CALL:
    action: shortcut
    name: My Shortcut
    label: Run Shortcut
    cooldown: 2.0
custom_gestures:
  HELLOWORLD:
    fingers:
    - false
    - false
    - false
    - false
    - false
    action: applescript
    label: Helloworld
    cooldown: 2.0
    script: asdasdasdasdasd
  TEST:
    fingers:
    - false
    - false
    - false
    - false
    - true
    action: shortcut
    label: Test
    cooldown: 2.0
    name: hello
settings:
  camera_index: 0
  detection_confidence: 0.7
  tracking_confidence: 0.5
  gesture_hold_frames: 20
  show_landmarks: true
  show_fps: true
